const KEY = "seo-audit-newpc-bg";
let state = {};
try{ state = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ state = {}; }

const mainEl = document.getElementById('main');
const navEl = document.getElementById('index-nav');

function itemId(si, ii){ return si + '-' + ii; }

function sectionCounts(si){
  const items = SECTIONS[si].items;
  let done = 0;
  items.forEach((_, ii) => { if(state[itemId(si,ii)]) done++; });
  return {done, total: items.length};
}

function totalCounts(){
  let done=0, total=0;
  SECTIONS.forEach((s, si) => {
    s.items.forEach((_, ii) => { total++; if(state[itemId(si,ii)]) done++; });
  });
  return {done, total};
}

function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
}

function renderProgress(){
  const {done, total} = totalCounts();
  document.getElementById('total-label').textContent = done + ' / ' + total;
  document.getElementById('total-bar').style.width = (total ? (done/total*100) : 0) + '%';
  SECTIONS.forEach((_, si) => {
    const c = sectionCounts(si);
    const navCount = document.querySelector('#nav-count-' + si);
    if(navCount) navCount.textContent = c.done + '/' + c.total;
  });
}

    const a = document.createElement('a');
    a.href = '#sec-' + si;
    a.innerHTML = '<span class="n">' + String(si+1).padStart(2,'0') + '</span><span class="t">' + sec.title + '</span><span class="c" id="nav-count-' + si + '"></span>';
    navEl.appendChild(a);

    // section card
    const card = document.createElement('section');
    card.className = 'card';
    card.id = 'sec-' + si;

    const h2 = document.createElement('h2');
    h2.innerHTML = '<span class="num">' + String(si+1).padStart(2,'0') + '</span>' + sec.title;
    card.appendChild(h2);

    const secProg = document.createElement('div');
    secProg.className = 'sec-progress';
    secProg.id = 'sec-progress-' + si;
    card.appendChild(secProg);

    const ul = document.createElement('ul');
    ul.className = 'items';

    sec.items.forEach((item, ii) => {
      const li = document.createElement('li');
      const id = itemId(si, ii);
      if(state[id]) li.classList.add('done');

      const label = document.createElement('label');
      label.className = 'chk';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!state[id];
      cb.addEventListener('change', () => {
        state[id] = cb.checked;
        li.classList.toggle('done', cb.checked);
        save();
        renderProgress();
      });

      const span = document.createElement('span');
      span.className = 'item-text';
      span.textContent = item.t;

      label.appendChild(cb);
      label.appendChild(span);
      li.appendChild(label);

      if(item.l){
        const link = document.createElement('a');
        link.className = 'tool-link';
        link.href = item.l.u;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = item.l.label + ' →';
        li.appendChild(link);
      }

      ul.appendChild(li);
    });

    card.appendChild(ul);
    mainEl.appendChild(card);
  });

  renderProgress();
}

build();

// active nav highlight
const navLinks = Array.from(document.querySelectorAll('nav.index a'));
const cards = Array.from(document.querySelectorAll('section.card'));
const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const idx = cards.indexOf(entry.target);
    if(entry.isIntersecting){
      navLinks.forEach(a => a.classList.remove('active'));
      if(navLinks[idx]) navLinks[idx].classList.add('active');
    }
  });
}, {rootMargin:'-20% 0px -70% 0px'});
cards.forEach(c => io.observe(c));

document.getElementById('reset-btn').addEventListener('click', () => {
  if(confirm('Да нулирам ли целия отбелязан напредък?')){
    state = {};
    save();
    document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    document.querySelectorAll('li').forEach(li => li.classList.remove('done'));
    renderProgress();
  }
});
</script>
</body>
</html>
